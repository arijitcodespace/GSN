dataset:
  name: tgbl-canparl
  root: data/

model:
  hidden: 384
  num_heads: 12
  head_dim: 32
  state_dim: 16
  num_layers: 1
  embed_dim: 128
  scorer: dot
  commit_alpha: 0.999
  time_feat_dim: 8
  time_scale: 435456000  # 14 years
  edge_gate_hidden: 32
  dropout: 0.0
  self_loops: false
  pre_message: false       # B0 ablation: feed neighbour summary into the SSM input
  conv_cache: true        # B  ablation: persistent Mamba-2 conv cache
  conv_cache_dt_decay: null  # optional: bucket-Δt decay τ for the conv cache
  intra_bucket_seq: false  # C  ablation: per-event SSM stepping within each bucket
  conv1d_kernel_size: 24    # Mamba-2 conv kernel width (effective horizon: K * batch_events events; only active when conv_cache=true)
  noise_scale: 0.0
  id_dim: 64
  temp: 0.541

trainer:
  lr: 1.0e-4
  beta_1: 0.9
  beta_2: 0.999
  weight_decay: 0.0
  clip_norm: 1.0
  loss_fn: bce
  lambda_wr: 0.0
  epochs: 5
  batch_events: 1024
  accumulate_every: 1
  train_neg_per_pos: 1
  val_test_neg_per_pos: 1
  seed: 2020
  weights_dir: checkpoints/tgbl-canparl/
  save_every_epoch: false  # write epoch_NNN.weights.h5 + buffers every epoch so we can post-hoc pick the actual peak
  train_on_val: true
# ---------------------------------------------------------------------------
# Adaptive node-wise commit gate
# Coarse-grained dataset — uniform mode already performs well here.
# adaptive_hazard available for ablation if needed.
# ---------------------------------------------------------------------------
adaptive_commit:
  commit_mode: uniform          # "uniform" = old behaviour | "adaptive_hazard" = learned gate
  gate_hidden: 64
  gate_layers: 2
  alpha_min: 1.0e-4
  alpha_max: 0.999
  lambda_min: 1.0e-5
  exposure_delta0: 0.05
  exposure_cn: 0.25
  lambda_alpha_prior: 1.0e-3
  lambda_alpha_saturation: 1.0e-4
  alpha_warmup_epochs: 2
